<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M4 6h16M4 12h16M4 18h16'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <title>Word Ladder — Le Jeu de Vocabulaire Éducatif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      // Permet d'injecter l'URL du backend lors du déploiement (ex: GitHub Actions)
      // Si __API_BASE__ n'est pas remplacé, on utilise une chaîne vide pour le proxy local
      // IMPORTANT : Si l'origine est GitHub Pages (static), on force l'URL du backend Render si connue
      const injectedBase = "__API_BASE__";
      window.API_BASE = injectedBase.startsWith("__") ? "" : injectedBase.replace(/\/$/, "");
      
      // Patch de sécurité : si on détecte qu'on est sur GitHub Pages et que API_BASE est vide,
      // on risque le 405 sur les POST. On peut tenter de deviner l'URL ou logger un avertissement.
      if (window.location.hostname.includes("github.io") && !window.API_BASE) {
        console.warn("Attention : API_BASE non configurée sur un hôte statique. Les requêtes POST risquent d'échouer (405).");
      }
    </script>
  </head>
  <body class="bg-dark text-light antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
