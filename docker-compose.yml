services:
  redis:
    image: redis:7-alpine
    container_name: wordladder-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wordladder-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - WL_REDIS_URL=redis://redis:6379/0
      - WL_REDIS_ENABLED=true
      - WL_DATABASE_URL=sqlite+aiosqlite:///app/state/wordladder.db
      - WL_ENVIRONMENT=development
      - WL_ENABLE_DB_RESET=${WL_ENABLE_DB_RESET:-false}
    volumes:
      - ./backend/data:/app/data
      - backend_db:/app/state
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  backend_db:
